<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Neapol Lake — коропове озеро: ціни, сектори, бронювання, правила, новини.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neapol Lake">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32.png">
<link rel="apple-touch-icon" href="public/apple-touch-icon.png">
<title>Neapol Lake — коропове озеро</title>
<style>
:root{--bg:#050505;--c:#12100c;--t:#f3e7c9;--m:#a8996f;--a:#d4a64a;--a2:#f5d98a;--b:#3a2f17;--g:linear-gradient(135deg,#f5d98a,#c89a3c 55%,#8a6420);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at top,#1a1408 0,#050505 55%) fixed;color:var(--t);font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif}
h2,h3,.logo,nav button,.btn,th{font-family:Cinzel,"Trajan Pro",Georgia,"Times New Roman",serif;letter-spacing:.06em}
header{background:#000;border-bottom:1px solid var(--a);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;gap:16px;justify-content:flex-end;padding:6px 16px;font-size:13px;background:var(--g)}
.top a{color:#14100a;text-decoration:none;font-weight:600}
.bar{padding:10px 16px;text-align:center}
.logo{font-weight:700;font-size:26px;letter-spacing:.3em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1120px;margin:0 auto;padding:16px;display:flex;gap:18px;align-items:flex-start}
main{flex:1;min-width:0}
nav{width:200px;flex:none;position:sticky;top:110px;display:flex;flex-direction:column;gap:6px;background:var(--c);border:1px solid var(--a);border-radius:12px;padding:10px;box-shadow:0 0 24px rgba(212,166,74,.12)}
nav button{background:none;border:1px solid transparent;color:var(--t);padding:11px 14px;border-radius:8px;font-size:14px;text-align:right;cursor:pointer;text-transform:uppercase}
nav button:hover{border-color:var(--b)}
nav button.on{background:var(--g);color:#14100a;font-weight:700}
h2{margin:6px 0 14px;color:var(--a2);text-transform:uppercase;letter-spacing:.14em;font-size:22px;border-bottom:1px solid var(--b);padding-bottom:8px}
h3{color:var(--a2)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}
.ph{width:100%;aspect-ratio:16/9;background:#1b160c;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--m);overflow:hidden;border:1px solid var(--b)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph.auto{aspect-ratio:auto;background:none}.ph.auto img{height:auto}
.ph.logo{background:#000;aspect-ratio:16/10;border-color:transparent}.ph.logo img{object-fit:contain}
.ph.short{aspect-ratio:16/6}
.hero{position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.grid .ph{aspect-ratio:4/5}
.news{border-left:4px solid var(--a)}.news small{color:var(--m)}.news.warn{border-left-color:#d9534f}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--m)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:#070604;color:var(--t);font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a)}
.btn{background:var(--g);color:#14100a;border:0;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;text-transform:uppercase}
.btn.g{background:#241d0e;color:var(--a2);border:1px solid var(--b)}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--a2)}
.free{color:#6fcf8f}.busy{color:#ff7a70}
a{color:var(--a2)}
footer{text-align:center;padding:24px;color:var(--m);font-size:13px;border-top:1px solid var(--b)}
#key{background:none;border:0;font-size:22px;cursor:pointer;opacity:.7}
.msg{padding:10px;border-radius:8px;margin-top:10px;background:#1e180b;border:1px solid var(--b)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#lb img{max-width:96%;max-height:96%}
@media(max-width:720px){.wrap{flex-direction:column-reverse;padding:12px}nav{width:100%;position:static;flex-direction:row;overflow-x:auto;padding:6px}nav button{white-space:nowrap;text-align:center;padding:9px 12px}.logo{font-size:20px}}
.ptable th{padding-top:16px;font-size:16px;border-bottom:1px solid var(--a)}.ptable tr:first-child th{padding-top:6px}.ptable td.pr{text-align:right;white-space:nowrap;font-weight:700;color:var(--a2);font-size:17px}.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.feat{display:flex;gap:12px;padding:12px;border:1px solid var(--b);border-radius:10px;background:#0b0905}.fi{font-size:26px;line-height:1}.fd{color:var(--m);font-size:14px;margin-top:2px}.tel{font-size:24px;font-weight:700;margin-bottom:6px}.tel a{text-decoration:none;color:var(--a2)}.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{margin-top:6px;text-decoration:none;display:inline-block}.cw{position:relative}.cal{position:absolute;z-index:20;left:0;width:100%;max-width:340px;background:#0b0905;border:1px solid var(--a);border-radius:12px;padding:10px;box-shadow:0 10px 30px #000}.cal.hide{display:none}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--a2);font-weight:700}.ch button{background:none;border:1px solid var(--b);color:var(--a2);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{text-align:center;color:var(--m);font-size:12px}
.dy{aspect-ratio:1;border:1px solid var(--b);background:#14100a;color:var(--t);border-radius:8px;cursor:pointer;font:inherit;padding:0}.dy:hover:not(:disabled){border-color:var(--a)}.dy:disabled{opacity:.25;cursor:default}
.dy.busy{background:#8c1510;color:#fff;border-color:#ff3b30;animation:glow 1.4s ease-in-out infinite alternate}
.dy.comp{background:#4a2600;color:#ffd7a8;border:1px dashed #ff9a3c}
.dy.cur{outline:2px solid var(--a2);font-weight:700}
@keyframes glow{from{box-shadow:0 0 2px #ff3b30}to{box-shadow:0 0 12px #ff3b30}}
.leg{font-size:12px;color:var(--m);margin-top:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:#241d0e;border:1px solid var(--a);padding:10px 16px;border-radius:10px;color:var(--t)}.cond{border:1px solid var(--a);border-radius:10px;padding:10px 14px;background:#0b0905;margin-bottom:8px}.cond ul{margin:6px 0 0;padding-left:20px}.chk{display:flex;gap:8px;align-items:flex-start;color:var(--t)!important;margin-top:12px}.chk input{margin-top:4px}.ptable input{margin:2px 0}.top svg{width:18px;height:18px;fill:currentColor;vertical-align:-4px;margin-right:6px}.fsoc{margin-bottom:8px}.fsoc a{display:inline-block;margin:0 10px;color:var(--a2)}.fsoc svg{width:28px;height:28px;fill:currentColor}.rules{margin:0;padding-left:28px}.rules li{padding:8px 0;border-bottom:1px solid var(--b)}.rules li:last-child{border:0}.rules li::marker{color:var(--a);font-weight:700}.no{color:#ff7a70;font-weight:700}.ban{border-color:#7a1410}.ban h3{color:#ff7a70}.bl,.okl{margin:0;padding-left:22px}.bl li{margin:6px 0}.okl li{list-style:'✔  ';margin:6px 0}.herobg{position:relative;border-radius:12px;overflow:hidden;height:min(78vh,560px);min-height:380px;background-size:cover;background-position:center 42%;display:flex;align-items:center;justify-content:center;color:var(--m);border:1px solid var(--b)}
.herobg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;z-index:1}
.herotxt{position:relative;z-index:2;background:rgba(0,0,0,.65);padding:24px;border-radius:12px;border:1px solid var(--b);backdrop-filter:blur(4px);margin:16px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top"><a href="tel:+380000000000">📞 +38 (000) 000-00-00</a></div>
  <div class="bar"><span class="logo">NEAPOL LAKE</span></div>
</header>
<div class="wrap">
  <nav>
    <button class="on" onclick="show('home')">Головна</button>
    <button onclick="show('prices')">Ціни</button>
    <button onclick="show('booking')">Бронювання</button>
    <button onclick="show('admin')">Адмінка</button>
  </nav>
  <main>
    <!-- Головна сторінка -->
    <div id="home" class="page">
      <div class="herobg">
        <img src="public/logo.webp" alt="Neapol Lake">
        <div class="herotxt">
          <h2>Ласкаво просимо</h2>
          <p>Найкраще коропове озеро для вашого відпочинку та трофейної риболовлі.</p>
        </div>
      </div>
      <br>
      <div class="grid">
        <div class="ph"><img src="public/foto_1.jpg" onclick="zoom(this)"></div>
        <div class="ph"><img src="public/foto_2.jpg" onclick="zoom(this)"></div>
        <div class="ph"><img src="public/foto_6.jpg" onclick="zoom(this)"></div>
      </div>
    </div>

    <!-- Ціни -->
    <div id="prices" class="page" style="display:none">
      <h2>Наші ціни</h2>
      <div class="card">
        <p>Риболовля (доба) — 500 грн</p>
        <p>Оренда сектора — 200 грн</p>
      </div>
    </div>

    <!-- Бронювання та Оплата -->
    <div id="booking" class="page" style="display:none">
      <h2>Бронювання сектора</h2>
      <div class="card">
